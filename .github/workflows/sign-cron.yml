# 電子契約の定期処理（タイムスタンプの再試行・自動リマインド・期限切れ・匿名化・日次ハッシュ）を1時間ごとに呼ぶ。
# Vercel の Hobby プランでは Cron が1日1回までのため、その補完として使う（任意）。
# リポジトリの Secrets に SIGN_APP_URL と SIGN_CRON_SECRET を設定すると動く。
name: sign-cron

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: /api/cron/run を呼ぶ
        env:
          URL: ${{ secrets.SIGN_APP_URL }}
          SECRET: ${{ secrets.SIGN_CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then echo "未設定のためスキップ"; exit 0; fi
          curl -fsS -H "Authorization: Bearer $SECRET" "$URL/api/cron/run"
